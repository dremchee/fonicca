name: Desktop builds

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-builds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Verify release version
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
          package-manager-cache: false
      - name: Verify matching application versions and tag
        id: check
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: node scripts/verify-release.mjs

      - name: Verify public model graph artifacts before packaging
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/verify-model-packs.mjs

  checks:
    name: Tests and compilation
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential pkg-config libssl-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libasound2-dev libudev-dev
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ubuntu-24.04-checks
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Run frontend tests
        run: pnpm test
      - name: Check types and build frontend
        run: pnpm build
      - name: Compile native application and run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib

  build:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, checks]
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # ort 2.0.0-rc.12 no longer ships Intel macOS binaries.
          - name: macOS · Apple Silicon
            runner: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
            artifact: fonicca-macos-arm64
          - name: Windows · x64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
            artifact: fonicca-windows-x64
          # ONNX Runtime uses __isoc23_* symbols from glibc 2.38+.
          - name: Linux · x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
            artifact: fonicca-linux-x64
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      UPDATE_REPOSITORY: ${{ vars.UPDATE_REPOSITORY || github.repository }}
      # AppImage tools must also work on runners without a mounted FUSE device.
      APPIMAGE_EXTRACT_AND_RUN: '1'

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Require updater signing credentials
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            echo 'Add the TAURI_SIGNING_PRIVATE_KEY repository secret before building a release.' >&2
            exit 1
          fi
          if [[ "$UPDATE_REPOSITORY" != "$GITHUB_REPOSITORY" && -z "$RELEASE_TOKEN" ]]; then
            echo 'Add RELEASE_TOKEN with Contents write access to the public updates repository.' >&2
            exit 1
          fi

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential pkg-config libssl-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf \
            libasound2-dev libudev-dev libfuse2t64 xdg-utils

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.runner }}-${{ matrix.target }}
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend tests
        run: pnpm test

      - name: Write updater configuration
        run: node scripts/updater-config.mjs --output .tauri-updater.json

      # beforeBuildCommand in tauri.conf.json checks types and builds the frontend.
      - name: Build installers
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --ci --target '${{ matrix.target }}' --bundles '${{ matrix.bundles }}' --config .tauri-updater.json -- --locked

      - name: Verify macOS updater archive
        if: runner.os == 'macOS'
        run: |
          app="src-tauri/target/${{ matrix.target }}/release/bundle/macos/Fonicca.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          archive="src-tauri/target/${{ matrix.target }}/release/bundle/macos/Fonicca.app.tar.gz"
          if [[ ! -s "$archive" || ! -s "$archive.sig" ]]; then
            echo 'Missing signed macOS updater archive; build both app and dmg targets.' >&2
            exit 1
          fi
          extracted="$(mktemp -d)"
          trap 'rm -rf "$extracted"' EXIT
          tar -xzf "$archive" -C "$extracted"
          codesign --verify --deep --strict --verbose=2 "$extracted/Fonicca.app"

      - name: Upload installers
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.sig

      - name: Link downloads in the build summary
        env:
          BUILD_NAME: ${{ matrix.name }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: printf '### %s\n\n[Download installers](%s)\n' "$BUILD_NAME" "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Draft release
    needs: [version, checks, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          pattern: fonicca-*
          path: installers
          merge-multiple: true

      - name: Verify artifacts and prepare manifest and checksums
        env:
          UPDATES_ENABLED: 'true'
          GH_REPO: ${{ vars.UPDATE_REPOSITORY || github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: node scripts/prepare-release.mjs

      - name: Create or update the release draft
        env:
          GH_TOKEN: ${{ vars.UPDATE_REPOSITORY != '' && vars.UPDATE_REPOSITORY != github.repository && secrets.RELEASE_TOKEN || github.token }}
          GH_REPO: ${{ vars.UPDATE_REPOSITORY || github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
          CROSS_REPOSITORY: ${{ vars.UPDATE_REPOSITORY != '' && vars.UPDATE_REPOSITORY != github.repository }}
        run: |
          assets=()
          while IFS= read -r path; do assets+=("$path"); done < release-assets.txt
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > release-draft.txt; then
            if [[ "$(cat release-draft.txt)" != true ]]; then
              echo 'Release is already published; refusing to replace its assets.' >&2
              exit 1
            fi
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            flags=(--draft --title "Fonicca $RELEASE_VERSION")
            if [[ "$CROSS_REPOSITORY" != true ]]; then flags+=(--verify-tag); fi
            notes_file="docs/releases/$RELEASE_TAG.md"
            if [[ -f "$notes_file" ]]; then
              flags+=(--notes-file "$notes_file")
            elif [[ "$CROSS_REPOSITORY" != true ]]; then
              flags+=(--generate-notes)
            else
              flags+=(--notes "Fonicca $RELEASE_VERSION. Download the installer for your platform below.")
            fi
            if [[ "$PRERELEASE" == true ]]; then flags+=(--prerelease); fi
            gh release create "$RELEASE_TAG" "${assets[@]}" "${flags[@]}"
          fi
          gh release view "$RELEASE_TAG" --json url --jq '"[Open release draft](" + .url + ")"' >> "$GITHUB_STEP_SUMMARY"
