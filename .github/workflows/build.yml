name: Desktop builds

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-builds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Verify release version
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
          package-manager-cache: false
      - name: Verify matching application versions and tag
        id: check
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: node scripts/verify-release.mjs

  build:
    needs: version
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # ort 2.0.0-rc.12 no longer ships Intel macOS binaries.
          - name: macOS · Apple Silicon
            runner: macos-15
            target: aarch64-apple-darwin
            bundles: dmg
            artifact: fonicca-macos-arm64
          - name: Windows · x64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
            artifact: fonicca-windows-x64
          - name: Linux · x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
            artifact: fonicca-linux-x64
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      # AppImage tools must also work on runners without a mounted FUSE device.
      APPIMAGE_EXTRACT_AND_RUN: '1'

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential pkg-config libssl-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf \
            libasound2-dev libudev-dev libfuse2 xdg-utils

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend tests
        run: pnpm test

      # beforeBuildCommand in tauri.conf.json checks types and builds the frontend.
      - name: Build installers
        run: pnpm tauri build --ci --target '${{ matrix.target }}' --bundles '${{ matrix.bundles }}' -- --locked

      - name: Upload installers
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage

      - name: Link downloads in the build summary
        env:
          BUILD_NAME: ${{ matrix.name }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: printf '### %s\n\n[Download installers](%s)\n' "$BUILD_NAME" "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Draft release
    needs: [version, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: fonicca-*
          path: installers
          merge-multiple: true

      - name: Verify installers and prepare checksums
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          root = Path('installers')
          formats = {'.dmg', '.exe', '.msi', '.deb', '.AppImage'}
          files = sorted(path for path in root.rglob('*') if path.is_file() and path.suffix in formats)
          missing = formats - {path.suffix for path in files}
          if missing:
              raise SystemExit(f'Missing installers: {sorted(missing)}')
          names = [path.name for path in files]
          if len(names) != len(set(names)) or any('\n' in name or '#' in name for name in names):
              raise SystemExit('Installer names must be unique and safe for release upload')
          checksums = root / 'SHA256SUMS.txt'
          lines = []
          for path in files:
              digest = hashlib.sha256()
              with path.open('rb') as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b''):
                      digest.update(chunk)
              lines.append(f'{digest.hexdigest()}  {path.name}\n')
          checksums.write_text(''.join(lines))
          Path('release-assets.txt').write_text(''.join(f'{path}\n' for path in [*files, checksums]))
          PY

      - name: Create or update the release draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          assets=()
          while IFS= read -r path; do assets+=("$path"); done < release-assets.txt
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > release-draft.txt; then
            if [[ "$(cat release-draft.txt)" != true ]]; then
              echo 'Release is already published; refusing to replace its assets.' >&2
              exit 1
            fi
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            flags=(--draft --verify-tag --generate-notes --title "Fonicca $RELEASE_VERSION")
            if [[ "$PRERELEASE" == true ]]; then flags+=(--prerelease); fi
            gh release create "$RELEASE_TAG" "${assets[@]}" "${flags[@]}"
          fi
          gh release view "$RELEASE_TAG" --json url --jq '"[Open release draft](" + .url + ")"' >> "$GITHUB_STEP_SUMMARY"
