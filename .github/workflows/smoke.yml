name: Native lifecycle smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'scripts/profile-resources.mjs'
      - 'scripts/resource-profile/**'
      - '.github/workflows/smoke.yml'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'vite.config.ts'
      - 'uno.config.ts'
      - 'model-packs/**'
      - 'docs/licenses/**'

permissions:
  contents: read

concurrency:
  group: native-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS app bundle
            runner: macos-15
          - name: Windows NSIS installation
            runner: windows-2022
          - name: Linux extracted AppImage
            runner: ubuntu-24.04
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      APPIMAGE_EXTRACT_AND_RUN: '1'
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential pkg-config libssl-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf libasound2-dev \
            libudev-dev libfuse2t64 xdg-utils xvfb xauth
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.runner }}-resource-smoke
          save-if: ${{ github.event_name == 'workflow_dispatch' }}
      - run: pnpm install --frozen-lockfile
      - name: Run packaged native lifecycle scenario
        run: |
          mkdir -p smoke-results
          if [[ "$RUNNER_OS" == Linux ]]; then
            xvfb-run -a node scripts/profile-resources.mjs --smoke smoke-results/result.json
          else
            node scripts/profile-resources.mjs --smoke smoke-results/result.json
          fi
      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-${{ runner.os }}
          path: smoke-results/
          if-no-files-found: warn
          retention-days: 14
