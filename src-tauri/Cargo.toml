[package]
name = "samplette"
version = "0.1.0"
description = "Sample library manager"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "samplette_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rodio = { version = "0.23", default-features = false, features = ["playback", "symphonia-all"] }
symphonia = { version = "0.5.5", features = ["all"] }
walkdir = "2.5"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-drag = "2.1.1"
thiserror = "2.0.21"
rayon = "1.12.0"
notify = "8"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }
stratum-dsp = "1.0.0"
ebur128 = "0.1.10"
regex = "1.13.1"
ort = "=2.0.0-rc.12"
rubato = "5.0.1"
realfft = "3.5.0"
ureq = "3.5.0"
sha2 = "0.11.1"
hound = "3.5.1"
signalsmith-stretch = "0.1.3"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"

# Audio decoding is ~70x slower unoptimized; optimize dependencies even in dev builds,
# and our own per-sample analysis loops a little.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
